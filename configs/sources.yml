# 경제 뉴스 수집 소스 정의 (YAML 지시서)

sources:
  # 1. 🇺🇸 미국 경제 종합 뉴스 (API 방식)
  - id: "us_economy_api"
    country: "US"
    topic: "economy"
    type: "api"
    provider: "rss2json_yahoo"
    endpoint: "https://api.rss2json.com/v1/api.json?rss_url=https://finance.yahoo.com/news/rssindex"

  # 2. 📈 글로벌 기업 주가 & 최신 뉴스 (yfinance 방식)
  - id: "global_company_stocks"
    country: "GLOBAL"
    topic: "stocks"
    type: "yfinance"
    provider: "yahoo_finance_sdk"
    supported_tickers: ["AAPL", "TSLA", "NVDA", "MSFT", "GOOGL"]

  # 3. 🇺🇸 미국 경제 뉴스 (웹 크롤링 - CNBC)
  - id: "us_economy_crawler"
    country: "US"
    topic: "economy"
    type: "crawler"
    engine: "playwright"
    target_url: "https://www.cnbc.com/economy/"
    wait_time: 2
    selectors:
      container: ".Card-titleContainer, .RiverHeadline-headline"
      title: "a.Card-title, a.RiverHeadline-headline"
      link: "a::attr(href)"

  # 4. 🇰🇷 한국 경제 뉴스 (웹 크롤링 - 네이버 경제)
  - id: "kr_economy_crawler"
    country: "KR"
    topic: "economy"
    type: "crawler"
    engine: "playwright"
    target_url: "https://news.naver.com/main/main.naver?mode=LSD&mid=shm&sid1=101"
    wait_time: 2
    selectors:
      container: ".sh_headline_list > li, .sa_text"
      title: ".sh_headline_title, .sa_text_title"
      link: "a::attr(href)"
      press: ".sh_headline_press, .sa_text_press"

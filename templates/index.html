<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기업 경제 뉴스 모니터링 대시보드</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .hero-banner { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 2.5rem 0; margin-bottom: 2rem; border-radius: 0 0 20px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .news-card { border: none; border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; background: white; height: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .news-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .press-badge { font-size: 0.75rem; font-weight: 600; padding: 0.35em 0.65em; border-radius: 6px; background-color: #e9ecef; color: #495057; }
        .quick-tag { cursor: pointer; transition: all 0.2s; }
        .quick-tag:hover { background-color: #0d6efd !important; color: white !important; }
        .search-box { border-radius: 30px; padding-left: 1.25rem; }
        .btn-search { border-radius: 30px; padding-left: 1.5rem; padding-right: 1.5rem; }
    </style>
</head>
<body>

    <!-- Header Banner -->
    <div class="hero-banner">
        <div class="container text-center">
            <h2 class="fw-bold mb-2"><i class="fa-solid fa-chart-line me-2"></i>기업 경제 뉴스 스마트 모니터링</h2>
            <p class="lead opacity-75 mb-4">원하는 기업 및 경제 키워드의 최신 뉴스를 실시간 수집 및 모니터링합니다.</p>
            
            <!-- Search Bar -->
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">
                    <div class="input-group input-group-lg shadow-sm">
                        <input type="text" id="searchInput" class="form-control search-box" placeholder="기업명 또는 검색어 입력 (예: 삼성전자, 현대차, 반도체)...">
                        <button class="btn btn-primary btn-search" id="searchBtn"><i class="fa-solid fa-magnifying-glass me-1"></i> 검색</button>
                        <button class="btn btn-warning btn-search ms-2 text-dark fw-semibold" id="crawlBtn" title="입력한 기업 뉴스 실시간 수집">
                            <i class="fa-solid fa-bolt me-1"></i> 즉시 수집
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Quick Keyword Filter -->
        <div class="d-flex flex-wrap gap-2 justify-content-center mb-4">
            <span class="fw-bold align-self-center me-2 text-secondary"><i class="fa-solid fa-fire text-danger me-1"></i>인기 기업:</span>
            <button class="btn btn-sm btn-outline-secondary rounded-pill quick-tag px-3" data-kw="">전체보기</button>
            <button class="btn btn-sm btn-outline-primary rounded-pill quick-tag px-3" data-kw="삼성전자">삼성전자</button>
            <button class="btn btn-sm btn-outline-primary rounded-pill quick-tag px-3" data-kw="SK하이닉스">SK하이닉스</button>
            <button class="btn btn-sm btn-outline-primary rounded-pill quick-tag px-3" data-kw="현대차">현대차</button>
            <button class="btn btn-sm btn-outline-primary rounded-pill quick-tag px-3" data-kw="카카오">카카오</button>
            <button class="btn btn-sm btn-outline-primary rounded-pill quick-tag px-3" data-kw="네이버">네이버</button>
            <button class="btn btn-sm btn-outline-success rounded-pill quick-tag px-3" data-kw="반도체">반도체</button>
            <button class="btn btn-sm btn-outline-success rounded-pill quick-tag px-3" data-kw="금리">금리</button>
        </div>

        <!-- Status Summary Bar -->
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h5 class="fw-bold mb-0 text-dark" id="resultsTitle">
                <i class="fa-regular fa-newspaper me-2 text-primary"></i>수집된 주요 뉴스
            </h5>
            <span class="badge bg-primary rounded-pill px-3 py-2 fs-6" id="newsCount">0 건</span>
        </div>

        <!-- Spinner -->
        <div id="loadingSpinner" class="text-center py-5 d-none">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
            <p class="mt-3 text-secondary fw-semibold">뉴스 데이터를 로딩 중입니다...</p>
        </div>

        <!-- News Card Container -->
        <div class="row g-3" id="newsContainer">
            <!-- Dynamic News Cards will be inserted here -->
        </div>
    </div>

    <!-- Screenshot Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-camera me-2"></i>수집 당시 화면 캡처</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImage" src="" class="img-fluid rounded border" alt="캡처 이미지">
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadNews('');

            // 검색 버튼 이벤트
            document.getElementById('searchBtn').addEventListener('click', () => {
                const kw = document.getElementById('searchInput').value.trim();
                loadNews(kw);
            });

            // 엔터키 검색
            document.getElementById('searchInput').addEventListener('keyup', (e) => {
                if (e.key === 'Enter') {
                    const kw = e.target.value.trim();
                    loadNews(kw);
                }
            });

            // 퀵 태그 버튼 이벤트
            document.querySelectorAll('.quick-tag').forEach(tag => {
                tag.addEventListener('click', (e) => {
                    const kw = e.target.getAttribute('data-kw');
                    document.getElementById('searchInput').value = kw;
                    loadNews(kw);
                });
            });

            // 즉시 수집 버튼 이벤트
            document.getElementById('crawlBtn').addEventListener('click', async () => {
                const kw = document.getElementById('searchInput').value.trim();
                if (!kw) {
                    alert('수집할 기업명이나 검색어를 입력해주세요! (예: 삼성전자)');
                    return;
                }

                if (!confirm(`'${kw}' 키워드로 실시간 크롤링을 실행하시겠습니까?`)) return;

                showSpinner(true);
                try {
                    const res = await fetch('/api/crawl', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ keyword: kw })
                    });
                    const data = await res.json();
                    alert(data.message);
                    loadNews(kw);
                } catch (err) {
                    alert('크롤링 실행 중 오류가 발생했습니다.');
                    console.error(err);
                } finally {
                    showSpinner(false);
                }
            });
        });

        async function loadNews(keyword) {
            showSpinner(true);
            const container = document.getElementById('newsContainer');
            container.innerHTML = '';

            try {
                const url = `/api/news?keyword=${encodeURIComponent(keyword)}`;
                const res = await fetch(url);
                const data = await res.json();

                document.getElementById('newsCount').innerText = `${data.total} 건`;
                document.getElementById('resultsTitle').innerHTML = keyword ? 
                    `<i class="fa-solid fa-magnifying-glass me-2 text-primary"></i>'${keyword}' 검색 결과` : 
                    `<i class="fa-regular fa-newspaper me-2 text-primary"></i>수집된 주요 뉴스`;

                if (data.items.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fa-regular fa-folder-open fs-1 text-muted mb-3 d-block"></i>
                            <h5 class="text-secondary">수집된 뉴스 데이터가 없습니다.</h5>
                            <p class="text-muted small">상단 '즉시 수집' 버튼을 눌러 '${keyword}' 관련 최신 뉴스를 긁어와보세요!</p>
                        </div>
                    `;
                    return;
                }

                data.items.forEach(item => {
                    const col = document.createElement('div');
                    col.className = 'col-md-6 col-lg-4 mb-3';
                    
                    const screenshotBtn = item.screenshot ? 
                        `<button class="btn btn-sm btn-outline-secondary mt-2 w-100" onclick="showScreenshot('${item.screenshot}')">
                            <i class="fa-solid fa-image me-1"></i> 수집 화면 캡처 보기
                         </button>` : '';

                    col.innerHTML = `
                        <div class="card news-card p-3 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="press-badge"><i class="fa-regular fa-building me-1"></i>${item.press}</span>
                                    <small class="text-muted" style="font-size: 0.75rem;"><i class="fa-regular fa-clock me-1"></i>${item.crawled_at}</small>
                                </div>
                                <h6 class="card-title fw-bold lh-base text-dark mb-3">
                                    <a href="${item.link}" target="_blank" class="text-decoration-none text-dark hover-blue">
                                        ${item.title}
                                    </a>
                                </h6>
                            </div>
                            <div>
                                <a href="${item.link}" target="_blank" class="btn btn-sm btn-outline-primary w-100 fw-semibold">
                                    기사 원문 읽기 <i class="fa-solid fa-arrow-up-right-from-square ms-1"></i>
                                </a>
                                ${screenshotBtn}
                            </div>
                        </div>
                    `;
                    container.appendChild(col);
                });

            } catch (err) {
                console.error('Failed to load news:', err);
                container.innerHTML = `<div class="col-12 text-center text-danger py-4">뉴스 데이터를 불러오는 데 실패했습니다.</div>`;
            } finally {
                showSpinner(false);
            }
        }

        function showSpinner(show) {
            const spinner = document.getElementById('loadingSpinner');
            if (show) spinner.classList.remove('d-none');
            else spinner.classList.add('d-none');
        }

        function showScreenshot(filename) {
            document.getElementById('modalImage').src = `/screenshots/${filename}`;
            const modal = new bootstrap.Modal(document.getElementById('imageModal'));
            modal.show();
        }
    </script>
</body>
</html>
